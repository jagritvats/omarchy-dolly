name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff (config in ruff.toml)
        run: pipx run ruff==0.17.4 check dolly

  test:
    # Arch, like Omarchy: the same python-opencv / numpy / ffmpeg users get
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: packages
        run: >
          pacman -Syu --noconfirm --needed git make python python-numpy python-opencv
          python-pillow python-pytest ffmpeg ttf-dejavu tesseract tesseract-data-eng nodejs
      - uses: actions/checkout@v4
      - name: run as a normal user (permission tests mean nothing as root)
        run: |
          useradd -m ci
          chown -R ci:ci .
          su ci -c "git config --global --add safe.directory '$PWD' && make test"
